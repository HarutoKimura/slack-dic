[project]
name = "slack-dic"
version = "0.2.0"
description = "Serverless Slack RAG Bot - AWS Lambda + Aurora PostgreSQL + Bedrock"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "tiktoken>=0.12.0",
    # Slack
    "slack-sdk>=3.33.0",
    # AWS
    "boto3>=1.35.0",
    # Database (local development with PostgreSQL)
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
# Development and testing
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "moto[all]>=5.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
